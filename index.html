<head>

    <title>Product Card</title>
    <link rel="stylesheet" href="card.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"

<body>
    <main class="card">
        <picture>
            <source srcset="image-product-desktop.jpg" alt="img product" media="(min-width:62.5em)">
            <img src="image-product-mobile.jpg" alt="img product" class="img-card">
        </picture>
        <div class="card-content">
            <p class="parfume">perfume</p>
            <h1 class="card-title margin-top">gabrielle essence eau de parfum</h1>
            <p class="product-description margin-top">A floral,solar and volutuous interpretation composed bu Oliver
                ploge,
                Perfumer-Creator for the House of CHANEL</p>
            <h2 class="price margin-top">$149.99</h2>
            <button type="button" class="add-to-car margin-top">Add to Cart</button>
        </div>
        </ة>
</body>

</html>
